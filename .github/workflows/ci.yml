# CI on every pull request and every push to main (D-11, D-12, D-13).
#
# The job names lint, typecheck, test, build, steiger, storybook, name-guard and integration
# are the required status contexts in .github/rulesets/main.json. Renaming one means changing
# the ruleset in the same PR, or merges block on a check that never reports. Keep them stable,
# never add a matrix to them, and never add path filters to this workflow (a skipped workflow
# leaves required checks pending forever).
#
# The root script `pnpm check:all` runs the same steps locally (CONTRIBUTING "Local checks").
# When a step is added to or removed from a required job here, update that script too.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm check:pins
      - run: node --test --test-reporter=tap scripts/check-pins.test.mjs
      - run: pnpm lint:root
      - run: pnpm turbo run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check generated API files
        run: pnpm check:api
      - run: pnpm turbo run build

  # api integration suite (UL-132) on real Postgres and Redis service containers. A required
  # check: its name is a required status context in .github/rulesets/main.json (see the header
  # comment). `pnpm test` (the test job) stays service-free. The images and digests are the ones
  # in compose.yaml; keep them in step.
  # Credentials are throwaway literals for a container that lives only as long as this job.
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U app -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 20 --health-start-period 10s
      redis:
        image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 5s --health-timeout 5s --health-retries 20 --health-start-period 5s
    env:
      # The stand wipes both stores before every test: a *_test database and Redis DB 1 only.
      DATABASE_URL: postgresql://app:app_ci_password@127.0.0.1:5432/app_test
      REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The specs import the generated Prisma client and @app/contracts from its dist.
      - run: pnpm --filter @app/contracts build
      - run: pnpm --filter @app/api generate
      - run: pnpm db:migrate
      - run: pnpm --filter @app/api test:integration

  # Required check: FSD layers and slice boundaries in apps/web (D-19).
  steiger:
    name: steiger
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @app/web lint:fsd

  # Required check: the Storybook build of the UI kit (D-21).
  storybook:
    name: storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @app/web build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

  # D-35: the product name may appear only in packages/config/product.ts (and the allowlist).
  # Plain Node, no pnpm install: the guard has zero dependencies. setup-node is still needed
  # because importing product.ts relies on Node 26 type stripping, not the runner default.
  name-guard:
    name: name-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The same expression release.yml derives the image name from, so product.ts and the
      # real image names cannot drift apart.
      - run: node scripts/check-product-name.mjs --expect-image-prefix "$IMAGE_NAME"
        env:
          IMAGE_NAME: ${{ vars.PRODUCT_SLUG || github.event.repository.name }}
      - run: node --test --test-reporter=tap scripts/check-product-name.test.mjs

  # Non-blocking warnings (D-14, D-24). NOT a required check and never added to the ruleset.
  # The PR title reaches the script only through step env, never through `run:` interpolation.
  pr-hygiene:
    name: pr-hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/pr-hygiene.sh
        env:
          TITLE: ${{ github.event.pull_request.title }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
